<div class="mt-10">
  <form method="get">
    <p-floatlabel>
     <input pInputText (input)="filter()" [(ngModel)]="filterValue" type="text" name="filterValue">  <label for="over_label">Student Details</label>
    </p-floatlabel>
  </form>
  <div class="shadow-md mt-2">
    <p-table [columns]="displayColumns" class="bg-gray-50" [value]="data" [rows]="10" paginator="true" [rowsPerPageOptions]="[10 , 20]">
      <ng-template  #header>
        <tr>
          @for (colName of displayColumns; track $index) {
            <th>{{colName}}</th>
          }
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-student>
        <tr>
          <td>{{student.id}}</td>
          <td>{{student.name}}</td>
          <td>{{student.department}}</td>
          <td>{{student.email}}</td>
          <td>{{student.year}}</td>
          <td> @if(student.resume) {
              <a [href]=url(student.resume)>Resume</a>
            }
            @else {
              <p>Not Uploaded</p>
            }</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
